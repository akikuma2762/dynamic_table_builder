<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppeteer Colspan 測試</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: white;
            color: #000;
            line-height: 1.4;
            font-size: 12px;
        }
        
        .section {
            margin: 30px 0;
            padding: 20px;
            border: 2px solid #007bff;
            border-radius: 8px;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
            table-layout: auto;
        }
        
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        th {
            font-weight: bold;
            background-color: #f5f5f5;
        }
        
        .debug {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }
        
        .highlight {
            background-color: yellow;
            padding: 2px 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🔍 Puppeteer Colspan 測試頁面</h1>
    <p>這個頁面模擬了與 Puppeteer PDF 生成相同的環境和樣式</p>
    
    <div class="section">
        <h2>1. 手動 HTML Colspan 測試</h2>
        <p>直接寫的 HTML，確認環境支援 colspan：</p>
        
        <table>
            <thead>
                <tr>
                    <th colspan="2" style="background-color: #e3f2fd;">手動跨兩欄</th>
                    <th style="background-color: #fff3e0;">第三欄</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>A1</td>
                    <td>A2</td>
                    <td>A3</td>
                </tr>
                <tr>
                    <td colspan="3" style="background-color: #e8f5e8;">手動跨三欄</td>
                </tr>
            </tbody>
        </table>
        
        <div class="debug">
手動 HTML 程式碼:
&lt;th colspan="2"&gt;手動跨兩欄&lt;/th&gt;
&lt;td colspan="3"&gt;手動跨三欄&lt;/td&gt;
        </div>
    </div>
    
    <div class="section">
        <h2>2. JavaScript 生成的表格</h2>
        <p>使用與生產環境相同的函數生成：</p>
        <div id="jsGeneratedTable"></div>
        <div id="jsDebugInfo" class="debug"></div>
    </div>
    
    <div class="section">
        <h2>3. 不同 colspan 值測試</h2>
        <div id="colspanVariations"></div>
    </div>
    
    <div class="section">
        <h2>4. Colgroup 影響測試</h2>
        <div id="colgroupTest"></div>
    </div>

    <script>
        // 複製生產環境的函數
        function calculateTableColumns(config) {
            if (config.headerRows.length === 0 && config.dataRowsCfg.length === 0) {
                return { totalCols: 0, colWidths: [] }
            }

            let maxCols = 0

            config.headerRows.forEach(row => {
                let colCount = 0
                row.forEach(cell => {
                    colCount += cell.colspan || 1
                })
                maxCols = Math.max(maxCols, colCount)
            })

            config.dataRowsCfg.forEach(row => {
                let colCount = 0
                row.cells.forEach(cell => {
                    colCount += cell.colspan || 1
                })
                maxCols = Math.max(maxCols, colCount)
            })

            let colWidths = []
            if (config.headerRows.length > 0 && config.headerRows[0].length > 0) {
                const firstHeaderRow = config.headerRows[0]
                let colIndex = 0
                
                firstHeaderRow.forEach(cell => {
                    const cellWidth = cell.width || 'auto'
                    const colspan = cell.colspan || 1
                    
                    for (let i = 0; i < colspan; i++) {
                        if (colIndex < maxCols) {
                            colWidths[colIndex] = cellWidth
                            colIndex++
                        }
                    }
                })
            }

            while (colWidths.length < maxCols) {
                colWidths.push('auto')
            }

            return { totalCols: maxCols, colWidths }
        }

        function tableConfigToHtml(config) {
            let html = '<table style="width: 100%; border-collapse: collapse; font-family: Microsoft JhengHei, PingFang TC, sans-serif; border: 1px solid #ccc; background-color: white; table-layout: auto;">'
            
            if (config.headerRows.length > 0 || config.dataRowsCfg.length > 0) {
                const { totalCols, colWidths } = calculateTableColumns(config)
                
                if (totalCols > 0) {
                    html += '<colgroup>'
                    colWidths.forEach(width => {
                        html += `<col style="width: ${width};">`
                    })
                    html += '</colgroup>'
                }
            }
            
            config.headerRows.forEach(row => {
                html += '<tr style="height: 40px;">'
                row.forEach(cell => {
                    // 與 Vue 組件保持一致：只在 > 1 時才添加 colspan
                    const colspan = cell.colspan && cell.colspan > 1 ? ` colspan="${cell.colspan}"` : ''
                    const rowspan = cell.rowspan && cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : ''
                    const bgColor = cell.bg || '#f5f5f5'
                    const textAlign = cell.align || 'center'
                    const fontSize = cell.size ? `${cell.size}px` : '12px'
                    const textColor = cell.color || '#000'
                    const style = `padding: 8px; text-align: ${textAlign}; font-weight: bold; background-color: ${bgColor}; border: 1px solid #ccc; height: 40px; vertical-align: middle; font-size: ${fontSize}; color: ${textColor};`
                    
                    html += `<th style="${style}"${colspan}${rowspan}>${cell.text || ''}</th>`
                })
                html += '</tr>'
            })
            
            config.dataRowsCfg.forEach(row => {
                html += '<tr style="height: 35px;">'
                row.cells.forEach(cell => {
                    // 與 Vue 組件保持一致：只在 > 1 時才添加 colspan
                    const colspan = cell.colspan && cell.colspan > 1 ? ` colspan="${cell.colspan}"` : ''
                    const rowspan = cell.rowspan && cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : ''
                    const bgColor = row.color || config.dataBg || '#ffffff'
                    const textAlign = cell.align || 'center'
                    const fontSize = cell.size ? `${cell.size}px` : '12px'
                    const textColor = cell.color || '#000'
                    const style = `padding: 8px; text-align: ${textAlign}; background-color: ${bgColor}; border: 1px solid #ccc; height: 35px; vertical-align: middle; font-size: ${fontSize}; color: ${textColor};`
                    
                    html += `<td style="${style}"${colspan}${rowspan}>${cell.text || ''}</td>`
                })
                html += '</tr>'
            })
            
            html += '</table>'
            return html
        }

        // 測試配置
        const testConfig = {
            headerRows: [
                [
                    { text: 'JS生成跨兩欄', colspan: 2, rowspan: 1, width: 'auto', align: 'center', color: '#000', size: 12, bg: '#e3f2fd' },
                    { text: 'JS生成第三欄', colspan: 1, rowspan: 1, width: 'auto', align: 'center', color: '#000', size: 12, bg: '#fff3e0' }
                ]
            ],
            dataRowsCfg: [
                {
                    color: '#ffffff',
                    cells: [
                        { text: 'B1', colspan: 1, rowspan: 1, align: 'center', color: '#000', size: 12 },
                        { text: 'B2', colspan: 1, rowspan: 1, align: 'center', color: '#000', size: 12 },
                        { text: 'B3', colspan: 1, rowspan: 1, align: 'center', color: '#000', size: 12 }
                    ]
                },
                {
                    color: '#e8f5e8',
                    cells: [
                        { text: 'JS生成跨三欄', colspan: 3, rowspan: 1, align: 'center', color: '#000', size: 12 }
                    ]
                }
            ],
            dataBg: '#ffffff'
        };

        function runTests() {
            // 測試 2: JavaScript 生成
            const jsTable = tableConfigToHtml(testConfig);
            document.getElementById('jsGeneratedTable').innerHTML = jsTable;
            
            // 顯示除錯資訊
            let debugInfo = 'JavaScript 生成的 HTML:\n';
            debugInfo += jsTable.replace(/></g, '>\n<') + '\n\n';
            
            // 分析 colspan 屬性
            const colspanMatches = jsTable.match(/colspan="(\d+)"/g);
            debugInfo += `找到的 colspan 屬性: ${colspanMatches ? colspanMatches.join(', ') : '無'}\n`;
            
            // 檢查實際 DOM
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = jsTable;
            const tempTable = tempDiv.querySelector('table');
            
            if (tempTable) {
                const rows = tempTable.querySelectorAll('tr');
                debugInfo += '\nDOM 結構分析:\n';
                rows.forEach((row, index) => {
                    const cells = row.querySelectorAll('th, td');
                    debugInfo += `第 ${index + 1} 行: ${cells.length} 個儲存格\n`;
                    cells.forEach((cell, cellIndex) => {
                        const colspan = cell.getAttribute('colspan');
                        debugInfo += `  儲存格 ${cellIndex + 1}: "${cell.textContent}" colspan=${colspan || '(無)'}\n`;
                    });
                });
            }
            
            document.getElementById('jsDebugInfo').textContent = debugInfo;
            
            // 測試 3: 不同 colspan 值
            testColspanVariations();
            
            // 測試 4: Colgroup 影響
            testColgroupEffect();
        }

        function testColspanVariations() {
            let html = '<h3>測試不同的 colspan 值:</h3>';
            
            // 測試 undefined colspan
            const config1 = {
                headerRows: [[
                    { text: 'undefined colspan', align: 'center', bg: '#ffebee' },
                    { text: '正常欄', align: 'center', bg: '#e8f5e8' }
                ]],
                dataRowsCfg: [],
                dataBg: '#ffffff'
            };
            
            // 測試 colspan = 0
            const config2 = {
                headerRows: [[
                    { text: 'colspan=0', colspan: 0, align: 'center', bg: '#fff3e0' },
                    { text: '正常欄', align: 'center', bg: '#e8f5e8' }
                ]],
                dataRowsCfg: [],
                dataBg: '#ffffff'
            };
            
            // 測試 colspan = 1
            const config3 = {
                headerRows: [[
                    { text: 'colspan=1', colspan: 1, align: 'center', bg: '#e3f2fd' },
                    { text: '正常欄', align: 'center', bg: '#e8f5e8' }
                ]],
                dataRowsCfg: [],
                dataBg: '#ffffff'
            };
            
            // 測試 colspan = 2
            const config4 = {
                headerRows: [[
                    { text: 'colspan=2', colspan: 2, align: 'center', bg: '#f3e5f5' }
                ]],
                dataRowsCfg: [{
                    color: '#ffffff',
                    cells: [
                        { text: 'A', align: 'center' },
                        { text: 'B', align: 'center' }
                    ]
                }],
                dataBg: '#ffffff'
            };
            
            const configs = [
                { name: 'undefined colspan', config: config1 },
                { name: 'colspan=0', config: config2 },
                { name: 'colspan=1', config: config3 },
                { name: 'colspan=2', config: config4 }
            ];
            
            configs.forEach(({ name, config }) => {
                const tableHtml = tableConfigToHtml(config);
                html += `<h4>${name}:</h4>`;
                html += `<div style="border: 1px solid #ddd; margin: 10px 0; padding: 10px;">${tableHtml}</div>`;
                
                const colspanMatches = tableHtml.match(/colspan="(\d+)"/g);
                html += `<p class="debug">生成的 colspan: ${colspanMatches ? colspanMatches.join(', ') : '無'}</p>`;
            });
            
            document.getElementById('colspanVariations').innerHTML = html;
        }

        function testColgroupEffect() {
            let html = '<h3>測試 Colgroup 的影響:</h3>';
            
            // 有 colgroup 的版本
            const withColgroup = `
                <table style="width: 100%; border-collapse: collapse; table-layout: auto; border: 1px solid #ccc;">
                    <colgroup>
                        <col style="width: auto;">
                        <col style="width: auto;">
                        <col style="width: auto;">
                    </colgroup>
                    <tr>
                        <th colspan="2" style="padding: 8px; border: 1px solid #ccc; background: #e3f2fd;">有 Colgroup - 跨兩欄</th>
                        <th style="padding: 8px; border: 1px solid #ccc; background: #fff3e0;">第三欄</th>
                    </tr>
                    <tr>
                        <td style="padding: 8px; border: 1px solid #ccc;">A</td>
                        <td style="padding: 8px; border: 1px solid #ccc;">B</td>
                        <td style="padding: 8px; border: 1px solid #ccc;">C</td>
                    </tr>
                </table>
            `;
            
            // 沒有 colgroup 的版本
            const withoutColgroup = `
                <table style="width: 100%; border-collapse: collapse; table-layout: auto; border: 1px solid #ccc;">
                    <tr>
                        <th colspan="2" style="padding: 8px; border: 1px solid #ccc; background: #e3f2fd;">無 Colgroup - 跨兩欄</th>
                        <th style="padding: 8px; border: 1px solid #ccc; background: #fff3e0;">第三欄</th>
                    </tr>
                    <tr>
                        <td style="padding: 8px; border: 1px solid #ccc;">A</td>
                        <td style="padding: 8px; border: 1px solid #ccc;">B</td>
                        <td style="padding: 8px; border: 1px solid #ccc;">C</td>
                    </tr>
                </table>
            `;
            
            html += '<h4>有 Colgroup:</h4>';
            html += `<div style="border: 1px solid #ddd; margin: 10px 0; padding: 10px;">${withColgroup}</div>`;
            
            html += '<h4>無 Colgroup:</h4>';
            html += `<div style="border: 1px solid #ddd; margin: 10px 0; padding: 10px;">${withoutColgroup}</div>`;
            
            html += '<p class="debug">比較兩個表格的視覺效果，看看 colgroup 是否影響 colspan</p>';
            
            document.getElementById('colgroupTest').innerHTML = html;
        }

        // 頁面載入時執行測試
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>
